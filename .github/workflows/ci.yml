name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/verify/skills.mjs
      - name: Validate published routing pack
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {validateRoutingPackPublication} from './dist/routing/index.js';
          const pack = validateRoutingPackPublication(JSON.parse(readFileSync('skills/delegate/routing-pack.json', 'utf8')));
          const earliest_entry_expires_at = pack.routes.flatMap(route => [...route.workers, ...route.reviewers]).map(entry => entry.expires_at).sort((a, b) => Date.parse(a) - Date.parse(b))[0] ?? null;
          console.log(JSON.stringify({status: 'VALID', content_digest: pack.content_digest, refresh_after: pack.refresh_after, expires_at: pack.expires_at, earliest_entry_expires_at}));
          NODE
